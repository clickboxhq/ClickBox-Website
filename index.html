<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This block is the HOMEPAGE default. On Vercel, middleware.ts rewrites
      these exact values per-route (title, description, canonical, og:*,
      twitter:*, robots) for every request, using src/seo/routes.ts as the
      single source of truth — so this file and the middleware can never
      define two different homepage titles. Client-side navigation is kept
      in sync by src/hooks/use-seo.ts. Local `vite dev` has no middleware,
      so non-home routes show these homepage defaults in dev; production
      always gets the correct per-route values.
    -->
    <title>ClickBox | Enterprise Cybersecurity Consulting & SOC as a Service</title>
    <meta name="description" content="ClickBox delivers enterprise-focused cybersecurity services — SOC as a Service, training, VAPT, ISO 27001 guidance, and data protection — for modern organizations.">
    <meta name="author" content="ClickBox" />
    <link rel="canonical" href="https://www.useclickbox.com/" />
    <meta name="robots" content="index, follow" />

    <!--
      Browser tab icon (favicon.ico / 16x16 / 32x32) is intentionally a
      different image from the larger icons below: Google's search-result
      favicon picker prefers larger icons (docs: "a multiple of 48px"), so
      keeping apple-touch-icon/192x192 on the ClickBox wordmark logo while
      the small tab icons use a different mark lets the two surfaces show
      different images without any per-crawler special-casing.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClickBox" />
    <meta property="og:url" content="https://www.useclickbox.com/" />
    <meta property="og:title" content="ClickBox | Enterprise Cybersecurity Consulting & SOC as a Service">
    <meta property="og:description" content="ClickBox delivers enterprise-focused cybersecurity services — SOC as a Service, training, VAPT, ISO 27001 guidance, and data protection — for modern organizations.">
    <meta property="og:image" content="https://www.useclickbox.com/og-cover.jpg">
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ClickBox — enterprise cybersecurity consulting and SOC as a Service" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@clickboxhq" />
    <meta name="twitter:title" content="ClickBox | Enterprise Cybersecurity Consulting & SOC as a Service">
    <meta name="twitter:description" content="ClickBox delivers enterprise-focused cybersecurity services — SOC as a Service, training, VAPT, ISO 27001 guidance, and data protection — for modern organizations.">
    <meta name="twitter:image" content="https://www.useclickbox.com/og-cover.jpg">
    <meta name="twitter:image:alt" content="ClickBox — enterprise cybersecurity consulting and SOC as a Service" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ClickBox Information Technology Ltd",
      "alternateName": "ClickBox",
      "url": "https://www.useclickbox.com/",
      "logo": "https://www.useclickbox.com/clickbox-logo.jpeg",
      "description": "ClickBox delivers enterprise-focused cybersecurity services — SOC as a Service, training, VAPT, ISO 27001 guidance, and data protection — for modern organizations.",
      "email": "info@useclickbox.com",
      "sameAs": [
        "https://www.instagram.com/clickboxhq",
        "https://x.com/clickboxhq",
        "https://www.linkedin.com/company/clickbox-hq/",
        "https://youtube.com/@clickbox-n4q"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ClickBox",
      "url": "https://www.useclickbox.com/"
    }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Tally embed loader -->
    <script>
      var d=document,
          w="https://tally.so/widgets/embed.js",
          v=function(){
            "undefined"!=typeof Tally
              ? Tally.loadEmbeds()
              : d.querySelectorAll("iframe[data-tally-src]:not([src])")
                  .forEach(function(e){ e.src=e.dataset.tallySrc });
          };
      if("undefined"!=typeof Tally) v();
      else if(d.querySelector('script[src="'+w+'"]')==null){
        var s=d.createElement("script");
        s.src=w; s.onload=v; s.onerror=v;
        d.body.appendChild(s);
      }
    </script>
  </body>
</html>
